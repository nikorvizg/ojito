<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para ti 🌻</title>
    <style>
        body {
            background-color: #fdf8e7;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            overflow-x: hidden;
            color: #4a4a4a;
            height: 100vh;
        }

        /* Estilo general para las "páginas" */
        .screen {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: absolute;
            top: 0;
            left: 0;
            transition: opacity 1s ease-in-out;
        }

        /* --- PANTALLA DE INICIO --- */
        #intro-screen {
            z-index: 10;
            background-color: #fdf8e7;
        }

        .intro-title {
            font-size: 2rem;
            color: #d4af37;
            margin-bottom: 20px;
        }

        .gif-container {
            cursor: pointer;
            transition: transform 0.3s;
            animation: pulse-gif 2s infinite;
        }

        .gif-container:hover {
            transform: scale(1.05);
        }

        .gif-container img {
            border-radius: 15px;
            max-width: 250px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .click-hint {
            margin-top: 20px;
            color: #999;
            font-size: 0.9rem;
        }

        @keyframes pulse-gif {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        /* --- PANTALLA DEL JARDÍN --- */
        #garden-screen {
            opacity: 0;
            pointer-events: none; /* Desactivado hasta que aparezca */
            z-index: 5;
        }

        .container {
            max-width: 600px;
            padding: 20px;
        }

        h1 {
            color: #d4af37;
            font-size: 2.2rem;
            margin-bottom: 5px;
        }

        #magic-heart {
            cursor: pointer;
            display: inline-block;
            transition: transform 0.1s;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        #magic-heart:active {
            transform: scale(0.7);
        }

        .subtitle {
            font-size: 1.1rem;
            margin-bottom: 30px;
            color: #7a7a7a;
        }

        .garden {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        /* Animación y diseño de las flores */
        .flower-scale {
            display: inline-block;
            transition: transform 0.3s;
        }

        .flower-scale:hover {
            transform: scale(1.1) !important;
        }

        .flower-wrapper {
            position: relative;
            width: 80px;
            height: 120px;
            animation: float 3s ease-in-out infinite;
        }

        .flower {
            position: absolute;
            top: 0;
            left: 0;
            width: 80px;
            height: 80px;
            z-index: 2;
        }

        .petal {
            position: absolute;
            width: 24px;
            height: 68px;
            background: radial-gradient(circle, #ffe600, #fbc02d);
            border-radius: 50%;
            top: 4px;
            left: 28px;
            transform-origin: center 36px;
            box-shadow: 0 0 4px rgba(0,0,0,0.1);
        }

        .p1 { transform: rotate(0deg); } .p2 { transform: rotate(45deg); }
        .p3 { transform: rotate(90deg); } .p4 { transform: rotate(135deg); }
        .p5 { transform: rotate(180deg); } .p6 { transform: rotate(225deg); }
        .p7 { transform: rotate(270deg); } .p8 { transform: rotate(315deg); }

        .center {
            position: absolute;
            width: 35px;
            height: 35px;
            background: radial-gradient(circle, #5d4037, #3e2723);
            border-radius: 50%;
            top: 22px;
            left: 22px;
            z-index: 10;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.5);
        }

        .stem {
            position: absolute;
            width: 6px;
            height: 80px;
            background: linear-gradient(to right, #2e7d32, #4caf50);
            top: 48px;
            left: 37px;
            z-index: 1;
            border-radius: 4px;
        }

        .leaf {
            position: absolute;
            width: 24px;
            height: 12px;
            background: #4caf50;
            border-radius: 50% 0 50% 0;
            top: 72px;
            left: 40px;
            z-index: 1;
            transform: rotate(-20deg);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .riddle {
            font-size: 0.85rem;
            color: #bfa888;
            font-style: italic;
            margin-top: 10px;
            opacity: 0.8;
            transition: opacity 0.5s;
        }

        /* --- MENSAJE OCULTO --- */
        .hidden-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -40%);
            width: 80%;
            max-width: 400px;
            padding: 30px 20px;
            font-size: 1.25rem;
            line-height: 1.6;
            color: #fff;
            background: rgba(46, 39, 35, 0.95);
            border: 2px solid #fbc02d;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            opacity: 0;
            visibility: hidden;
            transition: opacity 1s ease, transform 1s ease;
            z-index: 100;
        }

        .hidden-message.show {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%);
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(253, 248, 231, 0.8);
            backdrop-filter: blur(3px);
            opacity: 0;
            visibility: hidden;
            transition: opacity 1s ease;
            z-index: 50;
        }

        .overlay.show {
            opacity: 1;
            visibility: visible;
        }

    </style>
</head>
<body>

    <!-- ================= PANTALLA DE INICIO ================= -->
    <div id="intro-screen" class="screen">
        <h2 class="intro-title">Hola, te tengo una sorpresa... ✨</h2>
        
        <!-- Aquí está la línea que busca tu GIF -->
        <div class="gif-container" onclick="entrarAlJardin()">
            <img src="./mi-sorpresa.gif" alt="Sorpresa">
        </div>
        
        <p class="click-hint">Toca el GIF para abrir</p>
    </div>

    <!-- ================= PANTALLA DEL JARDÍN ================= -->
    <div id="garden-screen" class="screen">
        <div class="overlay" id="overlay"></div>

        <div class="container">
            <h1>¡Feliz 21 de Septiembre! <span id="magic-heart">💛</span></h1>
            <p class="subtitle">Un jardín entero para alegrar tu día...</p>

            <div class="garden" id="garden"></div>

            <p class="riddle" id="pista">Dicen que si le das 3 latidos al corazón, te revela un secreto...</p>
        </div>

        <div class="hidden-message" id="secreto">
            Y recuerda... <br><br>
            <span style="color: #ffe600; font-size: 1.1em;">
                <strong>Estas flores virtuales no serán las únicas que recibirás. 👀</strong>
            </span>
        </div>
    </div>

    <script>
        // --- LÓGICA DE TRANSICIÓN DE PANTALLAS ---
        function entrarAlJardin() {
            const intro = document.getElementById('intro-screen');
            const gardenScreen = document.getElementById('garden-screen');
            
            // Desvanece la pantalla de inicio
            intro.style.opacity = '0';
            
            // Espera a que termine la animación para esconderla y mostrar el jardín
            setTimeout(() => {
                intro.style.display = 'none';
                gardenScreen.style.pointerEvents = 'auto'; // Activa los clics en el jardín
                gardenScreen.style.opacity = '1';
            }, 800); // 800 milisegundos
        }

        // --- LÓGICA DEL JARDÍN Y LAS FLORES ---
        const garden = document.getElementById('garden');
        const numFlowers = 7; 

        for(let i = 0; i < numFlowers; i++) {
            let scale = (0.7 + Math.random() * 0.4).toFixed(2); 
            let delay = (Math.random() * 2).toFixed(2); 

            let flowerHTML = `
            <div class="flower-scale" style="transform: scale(${scale})">
                <div class="flower-wrapper" style="animation-delay: ${delay}s">
                    <div class="flower">
                        <div class="petal p1"></div><div class="petal p2"></div>
                        <div class="petal p3"></div><div class="petal p4"></div>
                        <div class="petal p5"></div><div class="petal p6"></div>
                        <div class="petal p7"></div><div class="petal p8"></div>
                        <div class="center"></div>
                    </div>
                    <div class="stem"></div>
                    <div class="leaf"></div>
                </div>
            </div>`;
            garden.innerHTML += flowerHTML;
        }

        // --- LÓGICA DEL SECRETO OCULTO (Los 3 latidos) ---
        let heartClicks = 0;
        const heart = document.getElementById('magic-heart');
        
        heart.addEventListener('click', function() {
            heartClicks++;
            
            if(heartClicks === 3) {
                document.getElementById('secreto').classList.add('show');
                document.getElementById('overlay').classList.add('show');
                document.getElementById('pista').style.opacity = '0';
            }
            
            if(heartClicks > 3) {
                document.getElementById('secreto').classList.remove('show');
                document.getElementById('overlay').classList.remove('show');
                heartClicks = 0; 
            }
        });
    </script>

</body>
</html>
